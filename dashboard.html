<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Dashboard - Admin Dashboard</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#06A10B" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="header-root"></div>
  <div id="sidebar-backdrop-root"></div>
  <div class="app-shell">
    <div id="sidebar-root"></div>
    <main class="main-content">
      <h1 class="page-title">স্বাগতম<span id="welcomeName"></span></h1>
      <div id="statsRow" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:20px;">
        <div class="placeholder-note">লোড হচ্ছে...</div>
      </div>

      <div class="card">
        <strong>দ্রুত শর্টকাট</strong>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;">
          <a class="btn btn-primary" href="approvals.html">Approvals দেখুন</a>
          <a class="btn btn-secondary" href="accounts.html">নতুন অ্যাকাউন্ট</a>
          <a class="btn btn-secondary" href="identity-reveal.html">Identity Reveal</a>
          <a class="btn btn-secondary" href="reports.html">Reports</a>
        </div>
      </div>

      <div class="card">
        <strong>সাম্প্রতিক Audit Log</strong>
        <div id="recentAudit" style="margin-top:10px;"><div class="placeholder-note">লোড হচ্ছে...</div></div>
      </div>
    </main>
  </div>
  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
